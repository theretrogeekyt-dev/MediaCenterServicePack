name: Docker Build, Test & Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Stage 1: Fast Host Unit & Integration Tests
  # ==========================================
  unit-tests:
    name: Run Python Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Execute pytest test suite
        run: |
          python -m pytest -v --tb=short

  # ==========================================
  # Stage 2: Build, Smoke Test & Package Docker Image
  # ==========================================
  docker-build:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build Docker image (load locally for testing)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: openmce:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # Live Container Smoke & Healthcheck Tests
      # ==========================================
      - name: Launch container for integration testing
        run: |
          docker run -d \
            --name openmce-ci-instance \
            -p 8080:8080 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=UTC \
            openmce:test

      - name: Wait for container healthy status
        run: |
          echo "Waiting for OpenMCE container to boot and initialize EPG..."
          for i in {1..30}; do
            STATUS=$(curl -s http://localhost:8080/health | grep -o '"status":"[^"]*"' || true)
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q 'healthy'; then
              echo "Container health check passed!"
              exit 0
            fi
            sleep 2
          done
          echo "Container health check timed out!"
          docker logs openmce-ci-instance
          exit 1

      - name: Validate EPG guide.mxf endpoint
        run: |
          echo "Testing /api/guide.mxf payload generation..."
          RESPONSE=$(curl -sSf http://localhost:8080/api/guide.mxf)
          # Verify XML declaration and root MXF element
          echo "$RESPONSE" | head -n 10
          echo "$RESPONSE" | grep -q '<MXF'
          echo "$RESPONSE" | grep -q 'McStore.dll'
          echo "MXF endpoint verification succeeded!"

      - name: Validate System Status endpoint
        run: |
          echo "Testing /api/status endpoint..."
          curl -sSf http://localhost:8080/api/status | grep -q '"timezone":"UTC"'
          echo "Status endpoint verification succeeded!"

      - name: Clean up test container
        if: always()
        run: |
          docker logs openmce-ci-instance || true
          docker stop openmce-ci-instance || true
          docker rm openmce-ci-instance || true

      # ==========================================
      # Export Image Artifact for Local Testing
      # ==========================================
      - name: Export Docker image tarball for manual download
        run: |
          echo "Saving Docker image to tar.gz archive..."
          docker save openmce:test | gzip > openmce-docker-image.tar.gz

      - name: Upload Docker image as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmce-docker-image
          path: openmce-docker-image.tar.gz
          retention-days: 14

      # ==========================================
      # Push to GitHub Container Registry (ghcr.io)
      # ==========================================
      - name: Push image to GitHub Container Registry
        uses: docker/build-push-action@v5
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

