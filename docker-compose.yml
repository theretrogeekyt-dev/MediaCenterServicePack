services:
  mediacenter:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/theretrogeekyt-dev/mediacenterservicepack:latest
    container_name: mediacenter-servicepack
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # System & Timezone configuration
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000

      # Direct EPG Service API Key (Primary: Schedules Direct / EPG Service Token)
      # When provided, the backend queries the service directly with zero client dependencies:
      - EPG_API_KEY=
      - SCHEDULES_DIRECT_KEY=
      # Optional: Custom EPG service endpoint (defaults to Schedules Direct):
      - EPG_SERVICE_URL=

      # Alternative: Upstream XMLTV Feed URL (e.g. from IPTV, HDHomeRun, or WebGrab+Plus)
      - XMLTV_URL=
      # Alternative: Legacy Schedules Direct user/pass credentials (if no direct API key is used)
      - SCHEDULES_DIRECT_USER=
      - SCHEDULES_DIRECT_PASS=

      # Metadata API Keys (for direct TMDb queries)
      # Get a free API key at https://www.themoviedb.org/settings/api
      - TMDB_API_KEY=

      # Background cron EPG sync schedule (standard crontab format)
      - CRON_EPG_SYNC=0 3 * * *      # Daily at 03:00 AM

    volumes:
      # Application persistent config, cache, and compiled guide.mxf (No media folders needed)
      - ./config:/config

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
