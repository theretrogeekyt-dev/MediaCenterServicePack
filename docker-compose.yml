services:
  mediacenter:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/theretrogeekyt-dev/mediacenterservicepack:latest
    container_name: mediacenter-servicepack
    restart: unless-stopped
    ports:
      - "8080:8080"
      # - "80:8080"        # Optional: uncomment only if host port 80 is free (Synology DSM/NAS uses port 80)
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      # System & Timezone configuration
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000

      # DNS Auto-Discovery & Domain Redirection Server
      - ENABLE_DNS_SERVER=true
      - DNS_PORT=53
      # Host IP for local LAN clients (auto-detects if left blank):
      - DNS_HOST_IP=
      # Public WAN IP or DDNS hostname for remote clients (auto-detects if left blank):
      - DNS_PUBLIC_IP=
      - DNS_AUTO_DETECT_PUBLIC_IP=true
      # Security & DDoS Protection for Public Port 53:
      # Refuse non-WMC queries from external WAN clients to prevent open resolver amplification
      - DNS_AUTHORITATIVE_ONLY=false
      - DNS_ALLOW_EXTERNAL_RECURSION=false
      - DNS_RATE_LIMIT_PER_SEC=50
      # Upstream DNS servers for general internet resolution:
      - UPSTREAM_DNS=1.1.1.1,8.8.8.8

      # TV Guide EPG Service Configuration (Schedules Direct)
      # Provide your Login Name & Password directly:
      - SCHEDULES_DIRECT_USER=
      - SCHEDULES_DIRECT_PASS=
      # Optional local postal code for antenna broadcast lineup (e.g. 67147):
      - POSTAL_CODE=
      # Or provide session token / username:password via EPG_API_KEY:
      - EPG_API_KEY=

      # Metadata API Keys (for direct TMDb queries)
      # Get a free API key at https://www.themoviedb.org/settings/api
      - TMDB_API_KEY=

      # Background cron EPG sync schedule (standard crontab format)
      - CRON_EPG_SYNC=0 3 * * *      # Daily at 03:00 AM

    volumes:
      # Application persistent config, cache, and compiled guide.mxf (No media folders needed)
      - ./config:/config
      # - ./src:/app/src       # Optional: only for local dev when git repo is cloned locally

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
